services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vok
      POSTGRES_PASSWORD: vok
      POSTGRES_DB: vok_laagyo
    ports:
      - "5432:5432"
    volumes:
      - vok_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vok -d vok_laagyo"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  vok_pgdata:
